<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="80" y1="60" x2="300" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="50%" stop-color="#2d6b9e"/>
      <stop offset="100%" stop-color="#4ecdc4"/>
    </linearGradient>
    <linearGradient id="speedLines" x1="0" y1="100" x2="320" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0"/>
      <stop offset="40%" stop-color="#4ecdc4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2d6b9e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="50" y1="220" x2="350" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#2d6b9e"/>
    </linearGradient>
  </defs>

  <!-- Speed lines -->
  <path d="M 40 85 Q 120 75, 200 80" stroke="url(#speedLines)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 20 105 Q 140 90, 240 95" stroke="url(#speedLines)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 50 125 Q 150 110, 220 115" stroke="url(#speedLines)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 70 145 Q 160 135, 210 138" stroke="url(#speedLines)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Runner figure - dynamic sprinting pose -->
  <g transform="translate(140, 40)">
    <!-- Head -->
    <circle cx="175" cy="30" r="18" fill="url(#bodyGrad)"/>

    <!-- Torso - leaning forward dynamically -->
    <path d="M 170 48 L 130 110" stroke="url(#bodyGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Leading arm (forward) -->
    <path d="M 155 65 L 190 55 L 210 70" stroke="url(#bodyGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Trailing arm (back) -->
    <path d="M 155 70 L 110 90 L 95 75" stroke="url(#bodyGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Leading leg (forward stride) -->
    <path d="M 130 110 L 175 130 L 210 115" stroke="url(#bodyGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Trailing leg (back kick) -->
    <path d="M 130 110 L 85 125 L 60 105" stroke="url(#bodyGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- MELBOURNE text -->
  <text x="200" y="220" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="48" letter-spacing="8" fill="url(#textGrad)">MELBOURNE</text>

  <!-- SPEED COACH text -->
  <text x="200" y="265" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="38" letter-spacing="12" fill="url(#bodyGrad)">SPEED COACH</text>
</svg>